[settings]
quiet = true
task_output = "interleave"
experimental = true
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
gum = "0.17.0"
uv = "0.11.19"
"aqua:shenwei356/rush" = "0.9.0"
"shiv:rudi" = "0.5"
"shiv:codebase" = "0.4"
"shiv:readme" = "0.3"
# git-crypt has no macOS binary on GitHub releases.
# macOS: brew install git-crypt
# Linux: downloaded from GitHub releases by rudi install

[_.codebase]
name = "notes"
lint = ["@all"]
